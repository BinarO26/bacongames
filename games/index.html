<title>Games</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0a1628);
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 6px 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  nav a {
    color: rgba(255,255,255,.5);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s ease;
    white-space: nowrap;
  }

  nav a:hover {
    color: #fff;
    background: rgba(255,255,255,.1);
    transform: translateY(-1px);
  }

  nav a.active {
    color: #000;
    background: #fff;
    font-weight: 600;
  }

  nav a.active:hover {
    transform: none;
  }

  .content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 120px 24px 100px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .top-row h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 0 14px;
    height: 38px;
    min-width: 220px;
  }

  .search-bar .icon {
    color: rgba(255,255,255,.3);
    font-size: 14px;
  }

  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }

  .search-bar input::placeholder {
    color: rgba(255,255,255,.3);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }

  @media (max-width: 900px) {
    .games-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 600px) {
    .games-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 400px) {
    .games-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .game-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: all .2s ease;
    cursor: pointer;
  }

  .game-card:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-3px);
    border-color: rgba(255,255,255,.15);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }

  .game-card .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.06);
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }

  .game-card .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .game-card .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,.5);
  }

  .game-card .info {
    padding: 10px 12px 12px;
  }

  .game-card .name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,.3);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: rgba(255,255,255,.25);
  }
</style>

  let games = [];       // [{ name, lower }]
  let searchDebounce = null;

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
  }

  function renderGames(list) {
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No games found</div>';
      return;
    }

    const html = new Array(list.length);

    for (let i = 0; i < list.length; i++) {
      const name = list[i].name;
      const safe = escapeHtml(name);
      const cover = COVERS[name];

      const thumb = cover
        ? `<div class="fallback">${safe}</div>` +
          `<img src="${escapeHtml(cover)}" alt="${safe}" loading="lazy" ` +
            `referrerpolicy="no-referrer" ` +
            `onload="this.previousElementSibling.style.display='none'" ` +
            `onerror="this.style.display='none'">`
        : `<div class="fallback">${safe}</div>`;

      html[i] =
        `<a class="game-card" href="./${encodeURIComponent(name)}/" target="_blank">` +
          `<div class="thumb">${thumb}</div>` +
          `<div class="info"><div class="name">${safe}</div></div>` +
        `</a>`;
    }

    grid.innerHTML = html.join('');
  }

  function filterGames() {
    const q = search.value.trim().toLowerCase();

    const filtered = games.filter(g => {
      // Secret is ONLY shown when the search is exactly "secret",
      // regardless of capitalization.
      if (g.lower === 'secret') {
        return q === 'secret';
      }

      return q === '' || g.lower.includes(q);
    });

    renderGames(filtered);
  }

  // Debounce so it doesn't re-render on every single keystroke
  function onSearchInput() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(filterGames, 120);
  }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;

      const parsed = JSON.parse(raw);

      if (Date.now() - parsed.timestamp > CACHE_TTL_MS) {
        return null;
      }

      return parsed.games;
    } catch {
      return null;
    }
  }

  function writeCache(list) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        timestamp: Date.now(),
        games: list
      }));
    } catch {
      // ignore quota/private-browsing errors
    }
  }

  function toGameList(items) {
    return items
      .filter(item =>
        item.type === 'dir' &&
        item.name.toLowerCase() !== 'images'
      )
      .map(item => item.name)
      .sort((a, b) => a.localeCompare(b));
  }

  async function fetchGamesFromApi() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    try {
      const res = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${GAMES_PATH}`,
        { signal: controller.signal }
      );

      clearTimeout(timeout);

      if (!res.ok) {
        throw new Error(`GitHub API returned ${res.status}`);
      }

      const items = await res.json();

      return toGameList(items);
    } finally {
      clearTimeout(timeout);
    }
  }

  function setGames(names) {
    games = names.map(name => ({ name, lower: name.toLowerCase() }));
    filterGames();
  }

  async function loadGames() {
    // 1. Show something instantly: cached list, otherwise the baked-in list
    const cached = readCache();

    setGames(cached || Object.keys(COVERS).sort((a, b) => a.localeCompare(b)));

    // 2. Always refresh in the background
    try {
      const fresh = await fetchGamesFromApi();

      writeCache(fresh);
      setGames(fresh);
    } catch (err) {
      console.error('Failed to refresh games list:', err);
    }
  }

  search.addEventListener('input', onSearchInput);
  loadGames();
</script>
