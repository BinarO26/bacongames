<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0a1628);
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 6px 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  nav a {
    color: rgba(255,255,255,.5);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s ease;
    white-space: nowrap;
  }
  nav a:hover { color: #fff; background: rgba(255,255,255,.1); transform: translateY(-1px); }
  nav a.active { color: #000; background: #fff; font-weight: 600; }
  nav a.active:hover { transform: none; }

  .content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 120px 24px 100px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .top-row h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 0 14px;
    height: 38px;
    min-width: 220px;
  }
  .search-bar .icon { color: rgba(255,255,255,.3); font-size: 14px; }
  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,.3); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }

  @media (max-width: 900px) { .games-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 600px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 400px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }

  .game-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: all .2s ease;
    cursor: pointer;
  }
  .game-card:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-3px);
    border-color: rgba(255,255,255,.15);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }

  .game-card .thumb {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }

  .game-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .game-card .info {
    padding: 10px 12px 12px;
  }

  .game-card .name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,.3);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: rgba(255,255,255,.25);
  }
</style>
</head>

  </div>

</div>

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');

  function renderGames(list) {
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No games found</div>';
      return;
    }
    grid.innerHTML = list.map(g =>
      `<a class="game-card" href="https://binaro26.github.io/bacongames/games/${g.name.replace(/ /g,'-')}">
        <div class="thumb">${g.image ? '<img src="' + g.image + '" alt="' + g.name + '">' : g.icon}</div>
        <div class="info">
          <div class="name">${g.name}</div>
        </div>
      </a>`
    ).join('');
  }

  function filterGames() {
    const q = search.value.trim().toLowerCase();
    const filtered = games.filter(g => g.name.toLowerCase().includes(q));
    renderGames(filtered);
  }

  renderGames(games);
