<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0a1628);
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 6px 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  nav a {
    color: rgba(255,255,255,.5);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s ease;
    white-space: nowrap;
  }
  nav a:hover { color: #fff; background: rgba(255,255,255,.1); transform: translateY(-1px); }
  nav a.active { color: #000; background: #fff; font-weight: 600; }
  nav a.active:hover { transform: none; }

  .content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 120px 24px 100px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .top-row h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 0 14px;
    height: 38px;
    min-width: 220px;
  }
  .search-bar .icon { color: rgba(255,255,255,.3); font-size: 14px; }
  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,.3); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }

  @media (max-width: 900px) { .games-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 600px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 400px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }

  .game-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: all .2s ease;
    cursor: pointer;
  }
  .game-card:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-3px);
    border-color: rgba(255,255,255,.15);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }

  .game-card .thumb {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }

  .game-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .game-card .info {
    padding: 10px 12px 12px;
  }

  .game-card .name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,.3);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: rgba(255,255,255,.25);
  }
</style>
</head>
<body>

<nav>
  <a href="https://binaro26.github.io/bacongames/">Home</a>
  <a href="https://binaro26.github.io/bacongames/games" class="active">Games</a>
  <a href="https://binaro26.github.io/bacongames/info">Information</a>
  <a href="https://binaro26.github.io/bacongames/settings">Settings</a>
</nav>

<div class="content">
  <div class="top-row">
    <h1>Games Library</h1>
    <div class="search-bar">
      <span class="icon">&#128269;</span>
      <input id="search" type="text" placeholder="Search Games..." oninput="filterGames()">
    </div>
  </div>
  <div class="games-grid" id="grid"></div>
</div>

<footer>Created by Pausuu & Binaro26</footer>

<script>
  const OWNER = 'BinarO26';
  const REPO = 'bacongames';
  const GAMES_PATH = 'games';
  const CACHE_KEY = 'bacongames_list_cache';
  const CACHE_TTL_MS = 30 * 60 * 1000; // 30 minutes

  let games = [];       // [{ name, lower }]
  let searchDebounce = null;

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');

  function renderGames(list) {
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No games found</div>';
      return;
    }

    // Build with an array + join (fast) instead of repeated string concatenation
    const html = new Array(list.length);
    for (let i = 0; i < list.length; i++) {
      const name = list[i].name;
      const encoded = encodeURIComponent(name);
      html[i] =
        `<a class="game-card" href="./${encoded}/">` +
          `<div class="thumb">` +
            `<div class="no-image">${name}</div>` +
            `<img src="images/${name}.png" alt="${name}" loading="lazy" ` +
              `onload="this.previousElementSibling.style.display='none'" ` +
              `onerror="this.style.display='none'">` +
          `</div>` +
          `<div class="info"><div class="name">${name}</div></div>` +
        `</a>`;
    }
    grid.innerHTML = html.join('');
  }

  function filterGames() {
    const q = search.value.trim().toLowerCase();
    const filtered = q === ''
      ? games
      : games.filter(g => g.lower.includes(q));
    renderGames(filtered);
  }

  // Debounce so it doesn't re-render on every single keystroke
  function onSearchInput() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(filterGames, 120);
  }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.timestamp > CACHE_TTL_MS) return null;
      return parsed.games;
    } catch {
      return null;
    }
  }

  function writeCache(list) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        timestamp: Date.now(),
        games: list
      }));
    } catch {
      // ignore quota/private-browsing errors
    }
  }

  function toGameList(items) {
    return items
      .filter(item => item.type === 'dir' && item.name.toLowerCase() !== 'images')
      .map(item => item.name)
      .sort((a, b) => a.localeCompare(b));
  }

  async function fetchGamesFromApi() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000); // 8s timeout

    try {
      const res = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${GAMES_PATH}`,
        { signal: controller.signal }
      );
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      const items = await res.json();
      return toGameList(items);
    } finally {
      clearTimeout(timeout);
    }
  }

  async function loadGames() {
    // 1. Show cached list instantly if we have one (feels instant on repeat visits)
    const cached = readCache();
    if (cached) {
      games = cached.map(name => ({ name, lower: name.toLowerCase() }));
      renderGames(games);
    } else {
      grid.innerHTML = '<div class="empty">Loading games...</div>';
    }

    // 2. Always refresh in the background so the list stays current
    try {
      const fresh = await fetchGamesFromApi();
      games = fresh.map(name => ({ name, lower: name.toLowerCase() }));
      writeCache(fresh);
      renderGames(games);
    } catch (err) {
      console.error('Failed to refresh games list:', err);
      // If we had nothing cached AND the fetch failed, show an error
      if (!cached) {
        grid.innerHTML = '<div class="empty">Could not load games list</div>';
      }
      // If we had a cache, just silently keep showing the cached version
    }
  }

  search.addEventListener('input', onSearchInput);
  loadGames();
</script>

</body>
</html>
